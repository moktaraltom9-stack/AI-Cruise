name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create fresh Flutter structure & Inject Dependencies
        run: |
          mkdir -p temp_lib
          if [ -f "lib/main.dart" ]; then cp lib/main.dart temp_lib/; fi

          flutter create . --org com.example --project-name ai_cruise --platforms android

          if [ -f "temp_lib/main.dart" ]; then cp temp_lib/main.dart lib/; fi

          # حقن مكتبة url_launcher تلقائياً في ملف pubspec.yaml لضمان عدم فقدانها
          cat << 'EOF' > pubspec.yaml
name: ai_cruise
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
